name: Build APK

on:
  push:
    branches: [main-disabled]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decrypt signing key
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$SIGNING_PASSWORD" ]; then
            printf '%s' "$SIGNING_PASSWORD" > "$RUNNER_TEMP/pw"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in signing/release.jks.enc -out "$RUNNER_TEMP/release.jks" -pass file:"$RUNNER_TEMP/pw"
            rm "$RUNNER_TEMP/pw"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_PASSWORD secret not set - using a throwaway debug key (updates will need an uninstall)."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          KEY_ALIAS: dekflix
          KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PappVersionName=1.0.${{ github.run_number }} \
            -PappVersionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk DekTV.apk
          cp DekTV.apk DekStream.apk  # keeps the old download link working

      - uses: actions/upload-artifact@v4
        with:
          name: DekTV
          path: DekTV.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DekTV v1.0.${{ github.run_number }}
          make_latest: true
          files: |
            DekTV.apk
            DekStream.apk
