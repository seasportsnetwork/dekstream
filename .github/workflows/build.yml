name: Build DekTV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decrypt signing key
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$SIGNING_PASSWORD" ]; then
            printf '%s' "$SIGNING_PASSWORD" > "$RUNNER_TEMP/pw"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in signing/release.jks.enc -out "$RUNNER_TEMP/release.jks" -pass file:"$RUNNER_TEMP/pw"
            rm "$RUNNER_TEMP/pw"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK (arm: Shield, Android TV, Fire TV)
        env:
          VERSION_NAME: 2.0.${{ github.run_number }}
          VERSION_CODE: ${{ 20000 + github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          KEY_ALIAS: dekflix
          KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleStandardRelease --stacktrace
          SRC=$(ls app/build/outputs/apk/standard/release/*.apk | head -n1)
          cp "$SRC" DekTV.apk
          cp DekTV.apk DekStream.apk   # keeps the old download link working

      - uses: actions/upload-artifact@v4
        with:
          name: DekTV
          path: DekTV.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: DekTV v2.0.${{ github.run_number }}
          body: DekTV is based on OwnTV (https://github.com/ahXN00/OwnTV), GPLv3. See NOTICE.md.
          make_latest: true
          files: |
            DekTV.apk
            DekStream.apk
