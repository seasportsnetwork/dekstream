name: DekTV
options:
  bundleIdPrefix: com.seasportsnetwork
  deploymentTarget:
    iOS: "16.0"
targets:
  DekTV:
    type: application
    platform: iOS
    sources: [DekTV]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seasportsnetwork.dektv
        PRODUCT_NAME: DekTV
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: DekTV/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
        SWIFT_OPTIMIZATION_LEVEL: "-O"
